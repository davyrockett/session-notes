<script>
const THEME_BG = { light: '#F1F0EC', dark: '#151310' };
function applyTheme(t) {
  const r = document.documentElement;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (t === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  meta.setAttribute('content', dark ? THEME_BG.dark : THEME_BG.light);
}
function savedTheme() { try { return localStorage.getItem('sn.theme') || 'light'; } catch { return 'light'; } }
applyTheme(savedTheme());
</script>

<style>
:root {
  --bg:#F1F0EC; --surface:#FFFFFF; --sunk:#E7E5DF; --ink:#1E1B18; --muted:#676767; --line:#D8D4CC;
  --accent:#F57C14; --accent-ink:#9A4204; --accent-soft:#FDE3CC; --good:#2E7D4F; --good-soft:#DDEFE3; --bad:#B3261E;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A3A3A3; --line:#3B342D;
  --accent:#FF9433; --accent-ink:#FFBD85; --accent-soft:#422712; --good:#7FCB9B; --good-soft:#1D3326; --bad:#FF8A80; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg:#151310; --surface:#201C18; --sunk:#2A2520; --ink:#F0EBE3; --muted:#A3A3A3; --line:#3B342D;
  --accent:#FF9433; --accent-ink:#FFBD85; --accent-soft:#422712; --good:#7FCB9B; --good-soft:#1D3326; --bad:#FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; }
.wrap { max-width: 620px; margin: 0 auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2 { font-family: var(--f-display); font-weight: 800; letter-spacing: .01em; line-height: 1.02; margin: 0; text-transform: uppercase; }
h1 { font-size: 2.4rem; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
header p { margin: 4px 0 0; color: var(--muted); }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); cursor: pointer; }

/* The line that says whether everything has been sent. Always there, so the list never shifts. */
.sendline { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; margin-bottom: 6px;
  color: var(--muted); font-size: .92rem; }
.sendline.warn { color: var(--accent-ink); }
.sendline.bad { color: var(--bad); }

.week h2 { font-size: 1.35rem; color: var(--muted); margin: 18px 0 8px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: 64px; padding: 10px 14px;
  background: none; border: 0; text-align: left; cursor: pointer; }
.row b { display: block; font-size: 1.08rem; line-height: 1.25; }
.row small { color: var(--muted); font-size: .88rem; }
.row.later b, .row.later small { color: var(--muted); }
.chip { font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.has { background: var(--good-soft); color: var(--good); }
.chip.wait { background: var(--accent-soft); color: var(--accent-ink); }
.chip.need { background: none; border: 1px solid var(--line); }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
.empty p { margin: 0 0 10px; }
.empty p:last-child { margin: 0; }

/* One session */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; margin: 0 0 8px -6px; border: 0; background: none;
  color: var(--muted); font-weight: 700; cursor: pointer; }
.sess-head h2 { font-size: 2rem; }
.sess-head p { margin: 4px 0 0; color: var(--muted); }
.recorder { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 26px 0 8px; }
.timer { font-family: var(--f-display); font-weight: 800; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); }
.recording .timer { color: var(--ink); }
.rec-btn { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: #1E1B18;
  box-shadow: 0 4px 14px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.14); }
.rec-btn:disabled { opacity: .5; cursor: default; }
.rec-btn svg { width: 52px; height: 52px; }
.rec-btn .stop { display: none; width: 44px; height: 44px; border-radius: 9px; background: #1E1B18; }
.recording .rec-btn .mic { display: none; }
.recording .rec-btn .stop { display: block; }
.recording .rec-btn::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--accent); animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { from { opacity: .9; transform: scale(.94); } to { opacity: 0; transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .recording .rec-btn::after { animation: none; opacity: .7; } }
.rec-label { font-weight: 700; min-height: 1.5em; }
.hint { color: var(--muted); font-size: .92rem; text-align: center; max-width: 34em; margin: 0 auto; min-height: 5.6em; }
.hint.bad { color: var(--bad); }
.takes h3 { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 1.2rem; color: var(--muted); margin: 22px 0 8px; }
.take { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 12px 14px; }
.take b { display: block; }
.take small { color: var(--muted); font-size: .88rem; }
.take small.wait { color: var(--accent-ink); }
.take small.ok { color: var(--good); }
.take .acts { display: flex; gap: 8px; }
.take audio { grid-column: 1 / -1; width: 100%; height: 40px; }
.none { color: var(--muted); margin: 0; padding: 14px; }

dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg { padding: 20px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.dlg-head h2 { margin: 0; font-size: 1.5rem; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 14px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row > div:first-child { flex: 1 1 180px; min-width: 0; }
.set-row .cap { margin: 2px 0 0; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.btn { font-size: .95rem; font-weight: 700; border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1E1B18; }
.btn.danger { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: .9rem; font-weight: 700; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #1E1B18; }
.key-form { display: flex; gap: 8px; flex: 1 1 100%; }
.key-form input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.update { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; padding: 8px 8px 8px 16px; border-radius: 12px;
  background: var(--ink); color: var(--bg); box-shadow: 0 6px 24px rgb(0 0 0 / .25); white-space: nowrap; }
</style>

<div class="wrap">

  <!-- Home: this week's sessions -->
  <main id="home">
    <header>
      <div>
        <h1>Session Notes</h1>

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

    <div class="dlg-head"><h2>Settings</h2><button type="button" class="icon-btn" id="settings-close" aria-label="Close">

<div class="update" id="update-banner" role="status" hidden><span>A new version is ready.</span><button type="button" class="btn primary" id="update-btn">Update</button></div>

<script>
'use strict';
/* Session Notes: David taps one of this week's sessions and records himself saying what happened.
   Recordings go to the private project davyrockett/session-notes-data; his Mac turns them into text.
     weeks/<monday>.json                         the week's sessions (written by the Mac each Monday)
     recordings/<monday>/<session>__<when>__<secs>s.<ext>   one file per recording (uploaded from here)
   Nothing about a session is kept in this public app: without the access key the list is empty. */

const REPO = 'davyrockett/session-notes-data';
const $ = (id) => document.getElementById(id);
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* blocked */ } }
function lsJson(k, fallback) { try { return JSON.parse(lsGet(k)) || fallback; } catch { return fallback; } }
const token = () => lsGet('sn.sync-token');

let weeks = lsJson('sn.weeks', []);    // newest first: [{ week, sessions: [{ id, date, start, time, name, written }] }]
let remote = lsJson('sn.remote', {});  // { week: [{ name, sha }] } = recordings already on GitHub
let local = [];                        // recordings kept on this device (see the database below)
let net = 'idle';                      // 'idle' | 'ok' | 'offline' | 'auth' | 'missing' | 'other'
let current = null;                    // { week, session } while one session is open

/* ---------- Recordings kept on this device (IndexedDB) ---------- */

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('session-notes', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('recs', { keyPath: 'file' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDo(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('recs', mode);
    const req = fn(tx.objectStore('recs'));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
  });
}
const dbAll = () => dbDo('readonly', (s) => s.getAll());
const dbPut = (rec) => dbDo('readwrite', (s) => s.put(rec));
const dbDel = (file) => dbDo('readwrite', (s) => s.delete(file));

async function loadLocal() {
  try { local = (await dbAll()) || []; } catch { local = []; }
  // Sent recordings stay playable here for three weeks, then make room.
  const old = Date.now() - 21 * 864e5;
  for (const r of local.filter((x) => x.uploaded && x.createdAt < old)) { try { await dbDel(r.file); } catch { /* keep it */ } }
  local = local.filter((x) => !(x.uploaded && x.createdAt < old));
}

/* ---------- Talking to GitHub ---------- */

class NetError extends Error { constructor(kind) { super(kind); this.kind = kind; } }

async function gh(path, options = {}) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
      method: options.method || 'GET',
      body: options.body ? JSON.stringify(options.body) : undefined,
      cache: 'no-store',
      headers: {
        Accept: options.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
        Authorization: `Bearer ${token()}`,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
      },
    });
  } catch { throw new NetError('offline'); }
  if (res.status === 401 || res.status === 403) throw new NetError('auth');
  return res;
}

async function refresh() {
  if (!token()) { net = 'idle'; render(); return; }
  try {
    const dir = await gh('/contents/weeks');
    if (dir.status === 404) {
      // No list yet, or a key that can't see the project: tell them apart.
      const repo = await gh('');
      if (!repo.ok) throw new NetError('missing');
      weeks = [];
    } else if (dir.ok) {
      // The newest two weeks always, plus older weeks (up to 8 back) that still have a session not written up.
      const names = (await dir.json()).map((f) => f.name).filter((n) => /^\d{4}-\d\d-\d\d\.json$/.test(n)).sort().slice(-8);
      const got = await Promise.all(names.map(async (n) => (await gh(`/contents/weeks/${n}`, { raw: true })).json()));
      weeks = got.filter((w, i) => w && w.week && Array.isArray(w.sessions) &&
        (i >= got.length - 2 || w.sessions.some((x) => !x.written))).reverse();
    } else throw new NetError('other');
    const lists = {};
    await Promise.all(weeks.map(async (w) => {
      const r = await gh(`/contents/recordings/${w.week}`);
      lists[w.week] = r.ok ? (await r.json()).map((f) => ({ name: f.name, sha: f.sha })) : [];
    }));
    remote = lists;
    lsSet('sn.weeks', JSON.stringify(weeks));
    lsSet('sn.remote', JSON.stringify(remote));
    net = 'ok';
  } catch (e) { net = e.kind || 'other'; }
  render();
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

let sending = false;
async function sendAll() {
  if (sending || !token()) { render(); return; }
  const waiting = local.filter((r) => !r.uploaded);
  if (!waiting.length) { render(); return; }
  sending = true;
  render();
  for (const rec of waiting) {
    try {
      const res = await gh(`/contents/recordings/${rec.week}/${rec.file}`, {
        method: 'PUT',
        body: { message: 'Recording', content: await blobToBase64(rec.blob) },
      });
      // 422 = this exact file is already there (an earlier try got through without us hearing back).
      if (!res.ok && res.status !== 422) throw new NetError(res.status === 404 ? 'missing' : 'other');
      rec.uploaded = true;
      await dbPut(rec);
      const body = res.ok ? await res.json().catch(() => null) : null;
      remote[rec.week] = (remote[rec.week] || []).filter((f) => f.name !== rec.file)
        .concat({ name: rec.file, sha: body && body.content ? body.content.sha : null });
      lsSet('sn.remote', JSON.stringify(remote));
      net = 'ok';
    } catch (e) { net = e.kind || 'other'; break; }
    render();
  }
  sending = false;
  render();
}

/* ---------- What each session has ---------- */

// File names carry everything: <session>__<yyyymmdd-hhmmss>__<seconds>s.<ext>
function parseFile(name) {
  const m = /^(.+)__(\d{8})-(\d{6})__(\d+)s\.\w+$/.exec(name);
  if (!m) return null;
  const [, session, d, t, secs] = m;
  return { session, secs: Number(secs),
    at: new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8), +t.slice(0, 2), +t.slice(2, 4), +t.slice(4, 6)) };
}

// Every recording for one session, from this device and from GitHub, oldest first.
function takesFor(week, sessionId) {
  const out = new Map();
  for (const f of remote[week] || []) {
    const p = parseFile(f.name);
    if (p && p.session === sessionId) out.set(f.name, { file: f.name, sha: f.sha, secs: p.secs, at: p.at, uploaded: true });
  }
  for (const r of local) {
    if (r.week !== week || r.sessionId !== sessionId) continue;
    const there = out.get(r.file);
    // Sent from here, but no longer on GitHub: the Mac has already turned it into text.
    if (r.uploaded && !there && net === 'ok') continue;
    out.set(r.file, { ...(there || {}), file: r.file, secs: r.secs, at: new Date(r.createdAt), uploaded: r.uploaded, blob: r.blob });
  }
  return [...out.values()].sort((a, b) => a.at - b.at);
}

const mmss = (secs) => `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, '0')}`;
function dayLabel(iso) {
  const d = new Date(`${iso}T12:00`);
  return `${d.toLocaleDateString('en-US', { weekday: 'short' })} ${d.getMonth() + 1}/${d.getDate()}`;
}
function weekLabel(iso, i) {
  const d = new Date(`${iso}T12:00`);
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7), 12);
  const diff = Math.round((monday - d) / 864e5);
  const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return diff === 0 ? `This week · ${date}` : diff === 7 ? `Last week · ${date}` : `Week of ${date}`;
}

/* ---------- Home screen ---------- */

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderSendLine() {
  const waiting = local.filter((r) => !r.uploaded).length;
  const line = $('sendline');
  let text = '', cls = '', button = false;
  if (!token()) text = '';
  else if (sending) text = 'Sending…';
  else if (net === 'auth') { text = 'The access key isn’t working. Check it in Settings.'; cls = 'bad'; }
  else if (net === 'missing') { text = 'The access key can’t reach the session notes project yet.'; cls = 'bad'; }
  else if (waiting) {
    text = `${waiting} recording${waiting === 1 ? '' : 's'} saved on this phone, waiting to send.`;
    cls = 'warn'; button = true;
  } else if (net === 'offline') text = 'No connection. Showing the last list this phone saw.';
  else if (net === 'ok') text = 'Everything has been sent.';
  $('send-text').textContent = text;
  line.className = `sendline ${cls}`;
  $('send-now').hidden = !button;
}

function sessionRow(week, s, i) {
  const takes = takesFor(week.week, s.id);
  const waiting = takes.filter((t) => !t.uploaded).length;
  const later = s.start && new Date(s.start) > new Date();
  const btn = el('button', `row${later && !takes.length ? ' later' : ''}`);
  btn.type = 'button';
  const left = el('span');
  left.append(el('b', '', s.name), el('small', '', s.date ? `${dayLabel(s.date)}${s.time ? ` · ${s.time}` : ''}` : (s.note || '')));
  let chip;
  if (waiting) chip = el('span', 'chip wait', 'Waiting to send');
  else if (takes.length) chip = el('span', 'chip has', takes.length === 1 ? 'Recorded' : `${takes.length} recordings`);
  else if (s.written) chip = el('span', 'chip has', 'Written up');
  else if (later) chip = el('span', 'chip', 'Upcoming');
  else if (s.id === 'other') chip = el('span', 'chip', '');
  else chip = el('span', 'chip need', 'Not recorded');
  if (!chip.textContent) chip.style.visibility = 'hidden';
  btn.append(left, chip);
  btn.addEventListener('click', () => openSession(week, s));
  const li = el('li');
  li.append(btn);
  return li;
}

function renderHome() {
  renderSendLine();
  const box = $('weeks');
  if (!token()) {
    const card = el('div', 'empty');
    card.append(el('p', '', 'This app needs your access key before it can show your sessions.'),
      el('p', '', 'Open the gear and paste it under Access key, or save it once on your Apps screen.'));
    box.replaceChildren(card);
    return;
  }
  if (!weeks.length) {
    const card = el('div', 'empty');
    card.append(el('p', '', net === 'ok' ? 'No sessions listed yet. Your Mac adds each week’s list on Monday morning.'
      : net === 'idle' ? 'Loading your sessions…' : 'Can’t load your sessions right now.'));
    box.replaceChildren(card);
    return;
  }
  box.replaceChildren(...weeks.map((w, i) => {
    const sec = el('section', 'week');
    const list = el('ul', 'list');
    const sessions = i === 0
      ? [...w.sessions, { id: 'other', name: 'Another session', note: 'Not on the list? Record it here.' }]
      : w.sessions;
    list.append(...sessions.map((s, n) => sessionRow(w, s, n)));
    sec.append(el('h2', '', weekLabel(w.week, i)), list);
    return sec;
  }));
}

/* ---------- One session ---------- */

const HINT = 'Say what you did from start to finish, how people responded and anything they said, and what you thought of it. Use initials, not names.';

function openSession(week, session) {
  current = { week: week.week, session };
  $('sess-name').textContent = session.name;
  $('sess-when').textContent = session.date ? `${dayLabel(session.date)}${session.time ? ` · ${session.time}` : ''}` : 'Start by saying which session this is.';
  setHint(session.hint || HINT);
  $('home').hidden = true;
  $('session').hidden = false;
  window.scrollTo(0, 0);
  renderTakes();
}

function closeSession() {
  if (recorder) stopRecording();
  current = null;
  $('session').hidden = true;
  $('home').hidden = false;
  render();
}

function setHint(text, bad) {
  $('hint').textContent = text;
  $('hint').className = `hint${bad ? ' bad' : ''}`;
}

function renderTakes() {
  if (!current) return;
  const list = $('takes');
  const takes = takesFor(current.week, current.session.id);
  if (!takes.length) {
    const li = el('li');
    li.append(el('p', 'none', current.session.written ? 'Already written up by your Mac.' : 'Nothing recorded yet.'));
    list.replaceChildren(li);
    return;
  }
  list.replaceChildren(...takes.map((t) => {
    const li = el('li', 'take');
    const info = el('span');
    const when = t.at.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    info.append(el('b', '', `${mmss(t.secs)} · ${when}`),
      el('small', t.uploaded ? 'ok' : 'wait', t.uploaded ? 'Sent' : 'Saved on this phone, waiting to send'));
    const acts = el('span', 'acts');
    const del = el('button', 'btn danger', 'Delete');
    del.type = 'button';
    del.addEventListener('click', () => deleteTake(t, del));
    acts.append(del);
    li.append(info, acts);
    if (t.blob) {
      const audio = el('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = URL.createObjectURL(t.blob);
      li.append(audio);
    }
    return li;
  }));
}

async function deleteTake(t, button) {
  if (!confirm('Delete this recording?')) return;
  button.disabled = true;
  try {
    if (t.uploaded) {
      let sha = t.sha;
      if (!sha) {
        const info = await gh(`/contents/recordings/${current.week}/${t.file}`);
        sha = info.ok ? (await info.json()).sha : null;
      }
      if (sha) {
        const res = await gh(`/contents/recordings/${current.week}/${t.file}`, { method: 'DELETE', body: { message: 'Delete recording', sha } });
        if (!res.ok && res.status !== 404) throw new NetError('other');
      }
      remote[current.week] = (remote[current.week] || []).filter((f) => f.name !== t.file);
      lsSet('sn.remote', JSON.stringify(remote));
    }
    await dbDel(t.file).catch(() => {});
    local = local.filter((r) => r.file !== t.file);
  } catch (e) {
    setHint(e.kind === 'offline' ? 'No connection. A sent recording can only be deleted when you’re online.' : 'Couldn’t delete that just now. Try again.', true);
    button.disabled = false;
    return;
  }
  renderTakes();
}

/* ---------- Recording ---------- */

let recorder = null, stream = null, chunks = [], startedAt = 0, ticker = 0, wakeLock = null;

async function startRecording() {
  if (!navigator.mediaDevices || !window.MediaRecorder) { setHint('This browser can’t record sound.', true); return; }
  $('rec-btn').disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch {
    $('rec-btn').disabled = false;
    setHint('The microphone is switched off for this app. Allow it in your phone’s settings (Safari → Microphone), then try again.', true);
    return;
  }
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  chunks = [];
  recorder = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 64000 });
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = saveRecording;
  recorder.start();
  startedAt = Date.now();
  $('recorder').classList.add('recording');
  $('rec-btn').disabled = false;
  $('rec-btn').setAttribute('aria-label', 'Stop recording');
  $('rec-label').textContent = 'Recording. Tap to stop.';
  setHint((current && current.session.hint) || HINT);
  ticker = setInterval(() => { $('timer').textContent = mmss((Date.now() - startedAt) / 1000); }, 250);
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch { wakeLock = null; }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

async function saveRecording() {
  const session = current && current.session, week = current && current.week;
  const type = (recorder && recorder.mimeType) || (chunks[0] && chunks[0].type) || 'audio/mp4';
  const secs = Math.round((Date.now() - startedAt) / 1000);
  clearInterval(ticker);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (wakeLock) { try { wakeLock.release(); } catch { /* gone already */ } }
  recorder = stream = wakeLock = null;
  $('recorder').classList.remove('recording');
  $('rec-btn').setAttribute('aria-label', 'Start recording');
  $('timer').textContent = '0:00';
  $('rec-label').textContent = 'Tap to record';
  const blob = new Blob(chunks, { type });
  chunks = [];
  if (!session || secs < 2 || !blob.size) { setHint('That was too short to keep. Tap to record again.', true); return; }
  const now = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}-${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
  const ext = /mp4|aac|m4a/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm';
  const rec = { file: `${session.id}__${stamp}__${secs}s.${ext}`, week, sessionId: session.id, createdAt: now.getTime(), secs, blob, uploaded: false };
  try {
    await dbPut(rec);
  } catch {
    setHint('This phone couldn’t save the recording (storage is full or blocked). Keep this screen open and check your connection.', true);
  }
  local.push(rec);
  setHint('Saved. Record again if you remember more.');
  renderTakes();
  sendAll();
}

$('rec-btn').addEventListener('click', () => (recorder ? stopRecording() : startRecording()));
$('back').addEventListener('click', closeSession);
// Leaving the app mid-recording: stop and keep what was said so far.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && recorder) stopRecording();
  if (document.visibilityState === 'visible') { refresh().then(sendAll); }
});
window.addEventListener('online', () => { refresh().then(sendAll); });
$('send-now').addEventListener('click', sendAll);

function render() {
  renderHome();
  if (current) renderTakes();
}

/* ---------- Settings: appearance, access key, updates ---------- */

function markTheme() {
  const cur = savedTheme();
  document.querySelectorAll('[data-theme-v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.themeV === cur));
}
document.querySelectorAll('[data-theme-v]').forEach((b) => b.addEventListener('click', () => {
  lsSet('sn.theme', b.dataset.themeV);
  applyTheme(b.dataset.themeV);
  markTheme();
}));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(savedTheme()));

function markKey(message) {
  const on = Boolean(token());
  $('key-line').textContent = message || (on ? 'Connected on this device.' : 'Not set on this device. The same key your other apps use.');
  $('key-remove').hidden = !on;
  $('key-form').hidden = on;
}
$('key-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const value = $('key-input').value.trim();
  if (!value) { markKey('Paste your access key first.'); return; }
  $('key-save').disabled = true;
  markKey('Checking…');
  lsSet('sn.sync-token', value);
  await refresh();
  $('key-save').disabled = false;
  if (net === 'ok') { $('key-input').value = ''; markKey(); sendAll(); return; }
  lsSet('sn.sync-token', null);
  markKey(net === 'offline' ? 'No connection. Try again when you’re online.'
    : net === 'auth' ? 'GitHub didn’t accept that key (mistyped or expired).'
    : 'That key can’t reach the session notes project. Give it access to session-notes-data on GitHub.');
  net = 'idle';
  render();
});
$('key-remove').addEventListener('click', () => {
  if (!confirm('Remove the access key from this device? Recordings already sent stay where they are.')) return;
  lsSet('sn.sync-token', null);
  weeks = []; remote = {};
  lsSet('sn.weeks', null); lsSet('sn.remote', null);
  net = 'idle';
  markKey();
  render();
});

function closeSettings() {
  if ($('key-input').value.trim() && !confirm('Discard your changes?')) return;
  $('key-input').value = '';
  $('settings').close();
}
$('settings-open').addEventListener('click', () => {
  markTheme();
  markKey();
  $('ver-line').textContent = `You're on ${window.APP_VERSION}.`;
  $('set-update').disabled = false;
  $('settings').showModal();
});
$('settings-close').addEventListener('click', closeSettings);
$('settings').addEventListener('click', (e) => { if (e.target === $('settings')) closeSettings(); });
$('settings').addEventListener('cancel', (e) => { e.preventDefault(); closeSettings(); });
$('set-update').addEventListener('click', async () => {
  const ver = $('ver-line'), ub = $('set-update'), reg = window.SW_REG;
  if (!reg || !navigator.onLine) { ver.textContent = 'Connect to the internet, then try again.'; return; }
  ub.disabled = true;
  ver.textContent = 'Checking…';
  try { await reg.update(); } catch { /* offline */ }
  const w = reg.waiting || reg.installing;
  if (w) {
    ver.textContent = 'Updating now…';
    const go = () => w.postMessage('skipWaiting');
    if (w.state === 'installed') go();
    else w.addEventListener('statechange', () => { if (w.state === 'installed') go(); });
  } else {
    ver.textContent = `You're on the latest version (${window.APP_VERSION}).`;
    ub.disabled = false;
  }
});

/* ---------- Start ---------- */

(async () => {
  await loadLocal();
  render();
  await refresh();
  sendAll();
})();
</script>

<script>
// Offline support + updates. See sw.js.
// The version shown in Settings. tools/bump.sh keeps this in step with VERSION in sw.js.
window.APP_VERSION = 'v3';
(async () => {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('sw.js');
  window.SW_REG = reg;
  const banner = document.getElementById('update-banner');
  const hadController = Boolean(navigator.serviceWorker.controller);
  const apply = (worker) => worker.postMessage('skipWaiting');
  // Right after the app opens, updates apply on their own; later on, offer a banner instead.
  const justOpened = () => performance.now() < 20000;
  const handle = (worker) => {
    if (!worker || !navigator.serviceWorker.controller) return;
    if (justOpened()) apply(worker);
    else {
      banner.hidden = false;
      document.getElementById('update-btn').onclick = () => apply(worker);
    }
  };
  const watch = (worker) => {
    if (!worker) return;
    if (worker.state === 'installed') return handle(worker);
    worker.addEventListener('statechange', () => { if (worker.state === 'installed') handle(worker); });
  };
  handle(reg.waiting);
  watch(reg.installing);
  reg.addEventListener('updatefound', () => watch(reg.installing));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // Never reload in the middle of a recording.
    if (hadController && !reloaded && !document.querySelector('.recording')) { reloaded = true; location.reload(); }
  });
  const check = () => { if (navigator.onLine) reg.update().catch(() => {}).then(() => handle(reg.waiting)); };
  check();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
})();
</script>
